# DocSolace configuration
baseUrl: http://localhost:5173

# Every capture point is shot at each of these viewports (same page/session —
# only the viewport size changes between shots, so navigation/auth state
# doesn't need to be repeated). The first entry is the "primary" one used for
# the login flow itself.
viewports:
  desktop:
    width: 1280
    height: 800
  mobile:
    width: 390
    height: 844

outputDir: .docsolace/artifacts

# Selectors masked on every capture, in addition to whatever a tour's own
# `mask` list adds. Keeps common volatile regions (timestamps, avatars) out
# of every tour spec instead of repeating them per tour.
defaultMask:
  - ".timestamp"
  - ".user-avatar"

# Intended cadence for the docs pipeline (informational — GitHub Actions
# triggers are static YAML, so .github/workflows/docs.yml's `on:` block must
# be kept in sync by hand if you change this). Options: manual-only
# (default — this is a solo-developer tool: run /document or
# `npm run generate-docs` yourself, when you want it), merge-to-main,
# release-tag. .github/workflows/docs.yml exists but is parked on
# workflow_dispatch (manual) until there's an actual reason to automate it.
runTrigger: manual-only

# A recaptured screenshot only replaces the committed one in docs/images/
# when the fraction of changed pixels exceeds this threshold — keeps binary
# git churn out of history for visually-insignificant re-renders.
pixelDiffThreshold: 0.005

# Auth profiles referenced by tours' preconditions.auth. Storage state from a
# successful login is cached under <outputDir>/.auth/<profile-id>.json and
# reused across runs instead of logging in per capture.
auth:
  standard-user:
    loginUrl: /login
    usernameSelector: "#username"
    passwordSelector: "#password"
    submitSelector: "button[type='submit']"
    usernameEnv: DOCSOLACE_STANDARD_USER_USERNAME
    passwordEnv: DOCSOLACE_STANDARD_USER_PASSWORD
    successUrlPattern: "**/dashboard"

# Named seed fixtures referenced by tours' preconditions.seed. The demo app
# has no seeding API — its demo data is static — so this one has no command
# and capture.mjs treats it as a no-op. A real target app can add a
# "command" (e.g. a script that resets/seeds its database) that capture.mjs
# runs before the tour — but only when allowSeedCommands (below) is true.
seeds:
  demo-baseline:
    description: "Static demo data baked into the demo app; no seeding step required."
    # command: "npm run db:seed -- --fixture=baseline"

# Off by default on purpose: a seed's "command" is config, and config is
# exactly as reachable by an unreviewed change as tour YAML is (both are
# project files a PR could touch) — CLAUDE.md says treat both as untrusted
# input for anything that shells out. Flip this to true only once you trust
# every seed command declared above; capture.mjs also accepts
# --allow-seed-commands as a one-off override without changing this file.
allowSeedCommands: false

# Controls generated page layout (see lib/docgen.mjs's renderTourPage).
# desktop stays inline in every step; every other viewport's screenshot
# collapses into a <details> block instead of stacking full-page screenshots
# the reader has to scroll past. This repo has no design skill applied (its
# own CLAUDE.md forbids inheriting any unrelated parent brand), so there's no
# docs/doc-style.json — just the default plain layout.
docs:
  primaryViewport: desktop
  collapseOtherViewports: true
  # Groups the three confirmed tours under one sidebar category instead of
  # a flat, alphabetical list — order here is the reading order (natural
  # learning path: sign in, see the dashboard, then export from it), not
  # alphabetical. Product pages always pin above every section regardless.
  sections:
    - label: Tutorials
      tours:
        - login
        - dashboard-overview
        - dashboard-export
  # Stamps each generated page with a real "last verified" date + short
  # commit SHA, both in frontmatter and as a visible line under the title
  # (see lib/docgen.mjs's renderTourPage) — off by default project-wide, on
  # here so this repo's own dogfood docs actually show it.
  stampVerified: true

# Extra grounding for product-scribe (see lib/product.mjs's DEFAULT_SOURCES,
# which already covers README.md/package.json/.env.example/this file/
# CHANGELOG.md). The README SEO split moved most reference material out of
# README.md into these companion pages, so they need to be listed here or
# product-scribe would lose that grounding for the configuration/
# troubleshooting pages.
product:
  sources:
    - CONFIGURATION.md
    - PUBLISHING.md
    - TROUBLESHOOTING.md
    - ADVANCED.md
    - CONTRIBUTING.md
