id: dashboard-overview
title: "Dashboard overview"
intent: "Show a new user what the main dashboard displays and how to read it."
maturity: stable
status: confirmed
preconditions:
  auth: standard-user
  seed: demo-baseline
steps:
  - action: goto
    path: /dashboard
  - capture: dashboard-full
    description: "Full dashboard after login"
    # .timestamp/.user-avatar are masked globally via docsolace.config.yaml's
    # defaultMask — no need to repeat them here.
  - action: click
    selector: "role=button[name='Filters']"
  - capture: dashboard-filters
    description: "Filter panel expanded"
code_paths:
  - demo-app/src/pages/Dashboard.jsx
  - demo-app/src/pages/Dashboard.css
