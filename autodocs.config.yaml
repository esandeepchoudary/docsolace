# AutoDocs configuration
baseUrl: http://localhost:5173

# Every capture point is shot at each of these viewports (same page/session —
# only the viewport size changes between shots, so navigation/auth state
# doesn't need to be repeated). The first entry is the "primary" one used for
# the login flow itself.
viewports:
  desktop:
    width: 1280
    height: 800
  mobile:
    width: 390
    height: 844

outputDir: .autodocs/artifacts

# Selectors masked on every capture, in addition to whatever a tour's own
# `mask` list adds. Keeps common volatile regions (timestamps, avatars) out
# of every tour spec instead of repeating them per tour.
defaultMask:
  - ".timestamp"
  - ".user-avatar"

# Intended cadence for the docs pipeline (informational — GitHub Actions
# triggers are static YAML, so .github/workflows/docs.yml's `on:` block must
# be kept in sync by hand if you change this). Options: merge-to-main
# (default — main is the "shipped" line), release-tag, manual-only.
runTrigger: merge-to-main

# A recaptured screenshot only replaces the committed one in docs/images/
# when the fraction of changed pixels exceeds this threshold — keeps binary
# git churn out of history for visually-insignificant re-renders.
pixelDiffThreshold: 0.005

# Auth profiles referenced by tours' preconditions.auth. Storage state from a
# successful login is cached under <outputDir>/.auth/<profile-id>.json and
# reused across runs instead of logging in per capture.
auth:
  standard-user:
    loginUrl: /login
    usernameSelector: "#username"
    passwordSelector: "#password"
    submitSelector: "button[type='submit']"
    usernameEnv: AUTODOCS_STANDARD_USER_USERNAME
    passwordEnv: AUTODOCS_STANDARD_USER_PASSWORD
    successUrlPattern: "**/dashboard"

# Named seed fixtures referenced by tours' preconditions.seed. The demo app
# has no seeding API — its demo data is static — so these are documentation
# only for now; a real target app would wire this to a fixture-loading step.
seeds:
  demo-baseline:
    description: "Static demo data baked into the demo app; no seeding step required."
