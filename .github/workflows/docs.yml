name: Update docs

# PARKED as a nice-to-have, not part of the core solo-developer workflow:
# AutoDocs is built for one person driving `/document` themselves (locally,
# or via the tutorial-need routine in CLAUDE.md) — a team-scale "regenerate
# automatically on every merge" pipeline isn't the primary use case, and this
# job is heavier than it looks (spins up the real app + a real browser + an
# LLM call per run). The logic is left intact and correct; it's just gated to
# manual dispatch only so it never fires — and never spends API budget —
# without someone deciding to run it. Flip the `on:` trigger back to
# `push: branches: [main]` if this project ever grows into something where
# automatic sync is worth the cost.
on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
          cd demo-app && npm ci

      - name: Start demo app
        run: |
          cd demo-app
          npm run dev &
          npx wait-on http://localhost:5173 --timeout 60000

      # state.json is gitignored by design (it's local drift-tracking state,
      # not a deliverable) — cache it across runs instead, or every run would
      # see every tour as dirty. The rolling key + prefix restore-key is the
      # standard idiom for a cache entry that needs to update every run.
      - name: Restore drift state
        uses: actions/cache@v4
        with:
          path: .autodocs/artifacts/state.json
          key: autodocs-state-${{ github.run_id }}
          restore-keys: |
            autodocs-state-

      - name: Capture all tours
        run: |
          for tour in tours/*.yaml; do
            id=$(basename "$tour" .yaml)
            npm run capture -- --tour "$id"
          done

      - name: Check drift
        id: drift
        run: |
          if npm run drift; then
            echo "dirty=false" >> "$GITHUB_OUTPUT"
          else
            echo "dirty=true" >> "$GITHUB_OUTPUT"
          fi

      # Runs Claude Code headlessly, following the same procedure as the
      # /document skill (plugin/skills/document/SKILL.md): for each dirty
      # tour, dispatch plugin/agents/doc-scribe.md via the Task tool to write
      # grounded prose, then run generate-docs.mjs to assemble the page.
      # The plugin isn't installed via a marketplace in this checkout, so the
      # prompt points Claude at the procedure files directly rather than
      # relying on `/document` skill auto-discovery.
      #
      # NOTE: verify `claude_args`/permission-mode syntax against
      # https://github.com/anthropics/claude-code-action before relying on
      # this in production — action inputs are the kind of detail that moves.
      - name: Generate docs for dirty tours
        if: steps.drift.outputs.dirty == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          prompt: |
            Follow the procedure in plugin/skills/document/SKILL.md for
            every tour `npm run drift` reports as dirty. Use
            plugin/agents/doc-scribe.md as the spec for the subagent step
            (dispatch it via the Task tool once per dirty tour). Captures
            already exist under .autodocs/artifacts/ — don't recapture.
            When done, summarize which tours were regenerated and why.
          claude_args: |
            {
              "allowedTools": "Bash,Read,Write,Task"
            }
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Open docs PR
        if: steps.drift.outputs.dirty == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: regenerate tutorials from latest capture"
          title: "docs: update generated tutorials"
          body: |
            Automated docs update — `main` changed in a way that affected
            one or more tours' `code_paths` or their captured screenshots.
            Generated by the `update-docs` workflow via the `/document`
            pipeline (drift gate → doc-scribe subagent → generate-docs).

            Review before merging, same as any other change to `docs/`.
          branch: autodocs/update-docs
          delete-branch: true
          add-paths: docs/**
