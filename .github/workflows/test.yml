name: Tests

# Runs the root Vitest suite (plugin/**/*.test.mjs + __tests__/**/*.test.mjs
# — see vitest.config.mjs) on every push and PR. Separate from docs.yml
# (parked on manual dispatch, regenerates docs content) and deploy-site.yml
# (builds/publishes the docs site) — this one just keeps the test suite
# itself honest, and backs the "Tests" badge in README.md.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
